networks:
  local-network:
    external: true
    name: docker-stack_local-network

services:
  altarun_api:
    build: ./api
    container_name: altarun_api
    restart: unless-stopped
    env_file:
      - api/.env
    networks:
      local-network:
        ipv4_address: 172.20.10.1
    logging:
      driver: "json-file"
      options:
        max-size: "10m" #On fait des fichiers de logs de 10mo
        max-file: "3" #On conserve que 3 fichiers de logs
    
  altarun_app:
    build: ./frontend
    container_name: altarun_app
    restart: unless-stopped
    env_file:
      - frontend/.env
    networks:
      local-network:
        ipv4_address: 172.20.10.2
    logging:
      driver: "json-file"
      options:
        max-size: "10m" #On fait des fichiers de logs de 10mo
        max-file: "3" #On conserve que 3 fichiers de logs