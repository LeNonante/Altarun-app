<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Altarun - Mot de passe oublié</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="logo">
                <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Altarun Logo">
                <h1>Altarun</h1>
            </div>
            <div class="welcome-section">
                <h2>Récupération</h2>
                <p>Entrez votre e-mail pour recevoir un lien.</p>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" required placeholder="nom@exemple.com">
                </div>
                <button type="submit" class="submit-btn">Envoyer le lien</button>
            </form>

            {% if message %}
                <div class="success-message" style="margin-top: 16px;">{{ message }}</div>
            {% endif %}

            <div class="footer-links">
                <a href="{{ url_for('login') }}">Retour à la connexion</a>
            </div>
        </div>
    </div>
</body>
</html>
