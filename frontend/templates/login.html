<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altarun - Connexion</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="logo">
                <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Altarun Logo">
                <h1>Altarun</h1>
            </div>

            <div class="welcome-section">
                <h2>Bienvenue, Athlète</h2>
                <p>Entrez vos informations de connexion.</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">                
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="e.g. marathon_runner"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Mot de passe
                        <a href="{{ url_for('forgot_password') }}" class="forgot-link">Mot de passe oublié ?</a>
                    </label>
                    <div class="password-input">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••"
                            required
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <input type="hidden" name="action" value="login">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <button type="submit" class="submit-btn">
                    Se connecter
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"></path>
                    </svg>
                </button>
            </form>

            {% if erreur %}
                <div class="error-message">{{ erreur }}</div>
            {% endif %}

            <div class="signup-section">
                <p>Nouveau sur la plateforme ? <a href="{{ url_for('signup') }}">Inscrivez-vous</a></p>
            </div>

            <div class="footer-links">
                <a href="https://github.com/LeNonante/Altarun-app" target="_blank">Github</a>
                <a href="{{ url_for('login') }}">Docs</a>
            </div>

            <div class="copyright">
                © 2026 ALTARUN - LeNonante & GROULOR - {{ version }}
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        }
    </script>
</body>
</html>
